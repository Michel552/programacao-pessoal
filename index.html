<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação Pessoal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Programação Pessoal</h1>

        <button id="novoEventoBtn">
            + Novo Evento
        </button>

    </header>

    <main>

        <div id="calendario"></div>

    </main>

    <dialog id="modalEvento">

        <h2>Novo Evento</h2>

<form id="formEvento">

    <div>
        <label>Status</label>
        <select id="status"></select>
    </div>

    <div>
        <label>CIA</label>
        <input type="text" id="cia">
    </div>

    <div>
        <label>Data Início</label>
        <input type="date" id="data_inicio">
    </div>

    <div>
        <label>Data Fim</label>
        <input type="date" id="data_fim">
    </div>

    <div>
        <label>Origem</label>
        <input type="text" id="origem">
    </div>

    <div>
        <label>Destino</label>
        <input type="text" id="destino">
    </div>

    <div>
        <label>Descrição</label>
        <input type="text" id="descricao">
    </div>

    <div>
        <label>Observação</label>
        <textarea id="observacao"></textarea>
    </div>

    <div class="botoes-modal">

        <button type="submit">
            Salvar
        </button>

        <button
            type="button"
            id="cancelarBtn">

            Cancelar

        </button>

    </div>

</form>

    </dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 
<script src="app.js"></script>

</body>

</html>
